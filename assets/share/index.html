<!doctype html>
<html lang="{{LangTag}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121514" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<title>{{Title}}</title>
<!--
  Страница раздачи Savio. Зашита в бинарник (`include_str!` в engine/share.rs)
  и отдаётся по адресу `/?k=<ключ>`. Всё внутри одного файла, кроме шрифтов:
  отдельные стили и скрипты пришлось бы раздавать отдельными маршрутами.

  Имена файлов — чужие данные: они пришли из папки на компьютере и могут
  содержать что угодно, в том числе разметку. Поэтому в страницу они попадают
  только через `textContent`, а в адреса — через `encodeURIComponent`.
  `innerHTML` с именем файла здесь был бы дырой: скрипт из имени увидел бы
  ключ в адресной строке.

  Цвета — палитра Savio из theme.rs, обе темы, и пары «текст на фоне» те же,
  что проверены там по контрасту: на вложенном блоке нет `--text-faint`, на
  акцентной подложке нет `--text-muted`. Что числа здесь совпадают с палитрой,
  держит `theme::tests::the_phone_page_wears_the_window_palette` — поправили
  цвет в theme.rs, поправьте и тут. Тема — как у телефона: страницу открывают
  на другом устройстве, и оно само знает, тёмное у него время суток или нет.

  Шрифты — те же файлы, что в окне, и подобраны так же, тройками: латиница,
  кириллица, армянский. `unicode-range` говорит браузеру, какой файл какому
  алфавиту, и он скачивает только нужные языку страницы. Порядок внутри
  семейства — как в theme.rs, и по той же причине: стрелки есть только
  в Figtree, точки «·» нет в Caprasimo.
-->
<style>
  @font-face { font-family: "Savio Display"; font-display: swap;
    src: url("/fonts/caprasimo.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0000-024F, U+2000-206F; }
  @font-face { font-family: "Savio Display Cyr"; font-display: swap;
    src: url("/fonts/kelly-slab.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0000-00FF, U+0400-052F, U+2000-206F; }
  @font-face { font-family: "Savio Display Arm"; font-display: swap;
    src: url("/fonts/armenian-display.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0530-058F, U+FB13-FB17; }
  @font-face { font-family: "Savio Text"; font-weight: 400; font-display: swap;
    src: url("/fonts/figtree.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0000-024F, U+2000-22FF; }
  @font-face { font-family: "Savio Text"; font-weight: 700; font-display: swap;
    src: url("/fonts/figtree-bold.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0000-024F, U+2000-22FF; }
  @font-face { font-family: "Savio Text Cyr"; font-weight: 400; font-display: swap;
    src: url("/fonts/nunito.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0000-00FF, U+0400-052F, U+2000-206F; }
  @font-face { font-family: "Savio Text Cyr"; font-weight: 700; font-display: swap;
    src: url("/fonts/nunito-bold.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0000-00FF, U+0400-052F, U+2000-206F; }
  @font-face { font-family: "Savio Text Arm"; font-weight: 400; font-display: swap;
    src: url("/fonts/armenian.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0530-058F, U+FB13-FB17; }
  @font-face { font-family: "Savio Text Arm"; font-weight: 700; font-display: swap;
    src: url("/fonts/armenian-bold.ttf?v={{Version}}") format("truetype");
    unicode-range: U+0530-058F, U+FB13-FB17; }

  /* Тёмная тема — Palette::dark(). */
  :root {
    --bg: #121514;
    --card-fill: #1a1f1f;
    --card-inner: rgba(255, 255, 255, 0.039);
    --progress-track: #0e1212;
    --border-subtle: rgba(255, 255, 255, 0.071);
    --border-strong: #6f7676;
    --border-hover: #8d9393;
    --text-primary: #f2f5f4;
    --text-secondary: #c2cccc;
    --text-muted: #8b9899;
    --text-on-accent: #0e2a2c;
    --accent: #7fc3c9;
    --accent-hover: #9bd2d8;
    --accent-active: #6bb0b6;
    --accent-soft: rgba(127, 195, 201, 0.161);
    --accent-text: #9fd6db;
    --state-success: #aebf92;
    --state-error: #d0766c;
    --state-warning: #e8b96a;
    --gloss-line: rgba(255, 255, 255, 0.051);
    --shadow: rgba(0, 0, 0, 0.275);
  }
  /* Светлая тема — Palette::light(). */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f2ec;
      --card-fill: #ffffff;
      --card-inner: rgba(26, 31, 31, 0.051);
      --progress-track: #e3e0d8;
      --border-subtle: rgba(26, 31, 31, 0.102);
      --border-strong: #7a7a76;
      --border-hover: #61625e;
      --text-primary: #171b1b;
      --text-secondary: #43504f;
      --text-muted: #56605f;
      --text-on-accent: #ffffff;
      --accent: #266b72;
      --accent-hover: #1f5a60;
      --accent-active: #17474c;
      --accent-soft: rgba(38, 107, 114, 0.122);
      --accent-text: #1f5f66;
      --state-success: #465231;
      --state-error: #a14237;
      --state-warning: #6f4b08;
      --gloss-line: rgba(26, 31, 31, 0.059);
      --shadow: rgba(0, 0, 0, 0.11);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font: 16px/1.45 "Savio Text", "Savio Text Cyr", "Savio Text Arm", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .display { font-family: "Savio Display", "Savio Display Cyr", "Savio Display Arm", Georgia, serif; font-weight: 400; }
  main { max-width: 640px; margin: 0 auto; }

  /* Шапка: акцентная точка и имя, как в рельсе окна. */
  header { display: flex; align-items: center; gap: 10px; margin: 4px 6px 18px; flex-wrap: wrap; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
  header .logo { font-size: 26px; line-height: 1.1; }
  header .sub { margin-left: auto; color: var(--text-muted); font-size: 14px; }

  /* Карточка — `theme::card_frame`: скругление 28, поля 18, тень и блик. */
  .card {
    background: var(--card-fill);
    border: 1px solid var(--border-subtle);
    border-radius: 28px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: inset 0 1px 0 var(--gloss-line), 0 6px 24px var(--shadow);
  }
  .title { font-size: 22px; line-height: 1.2; margin: 0 0 6px; display: flex; align-items: baseline; gap: 8px; }
  /* Стрелка — полужирным основным шрифтом и акцентом, как в `direction_cards`:
     в заголовочных гарнитурах стрелок нет. */
  .arrow { font-family: "Savio Text", system-ui, sans-serif; font-weight: 700; font-size: 19px; color: var(--accent); }
  .note { color: var(--text-secondary); font-size: 14px; margin: 0 0 14px; }
  .note.quiet { color: var(--text-muted); }
  .note.under-cta { margin: 10px 4px 0; }
  .note.under-row { margin-top: 6px; }
  .label { color: var(--text-muted); font-size: 13px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  /* Ряд заголовка с кнопкой переносится целиком: длинное слово заголовка
     (по-армянски «Համակարգչից») не делится, и в узком экране без переноса
     оно налезало на «Обновить». Сжиматься заголовку не даём — пусть
     кнопка уйдёт на следующую строку. */
  .head { flex-wrap: wrap; row-gap: 8px; }
  .head .title { margin: 0; flex: 1 1 auto; }
  .grow { flex: 1; min-width: 0; }
  .hidden { display: none !important; }

  /* Кнопки — «таблетки»: контурная вторичная и залитая главная. */
  .pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 40px; padding: 0 16px;
    border-radius: 999px; border: 1px solid var(--border-strong);
    background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 15px; text-decoration: none; white-space: nowrap;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .pill.small { min-height: 34px; padding: 0 14px; font-size: 14px; }
  .pill:active { background: var(--card-inner); border-color: var(--accent); color: var(--text-primary); }
  .cta {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 52px; padding: 0 18px;
    border-radius: 999px; border: 0;
    background: var(--accent); color: var(--text-on-accent);
    font-size: 19px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s, transform 0.1s;
  }
  .cta:active { background: var(--accent-active); transform: scale(0.98); }
  @media (hover: hover) {
    .pill:hover { background: var(--card-inner); border-color: var(--border-hover); color: var(--text-primary); }
    .cta:hover { background: var(--accent-hover); }
  }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* Выбор папки — `choice_pill`: выбранная с акцентной подложкой и кромкой. */
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .choice {
    min-height: 40px; padding: 0 14px; max-width: 100%;
    border-radius: 999px; border: 1px solid var(--border-strong);
    background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 15px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .choice[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }

  /* Списки — вложенные карточки `theme::inner_frame`. */
  ul { list-style: none; margin: 0; padding: 0; }
  .item {
    background: var(--card-inner);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 12px 14px;
    margin-top: 8px;
  }
  .name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag {
    flex: none; max-width: 45%;
    color: var(--text-muted); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .meta { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
  .meta.ok { color: var(--state-success); }
  .meta.bad { color: var(--state-error); }
  .bar { height: 6px; border-radius: 3px; background: var(--progress-track); margin: 9px 0 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width 0.25s linear; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* Сводка отправки с «Отменить все». */
  .batch { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-subtle); }
  .batch .grow { color: var(--text-secondary); font-size: 14px; }

  /* Баннер — `banner` окна: вложенный блок с цветной полосой слева. */
  .banner {
    display: flex; gap: 10px;
    background: var(--card-inner);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 12px 14px;
    font-size: 14px;
    margin-top: 12px;
    color: var(--state-warning);
  }
  .banner::before { content: ""; flex: none; width: 3px; border-radius: 2px; background: currentColor; }
  .banner.bad { color: var(--state-error); }
  .banner.out { margin: 0 0 16px; background: var(--card-fill); }
</style>
</head>
<body>
<main>
  <header>
    <span class="dot" aria-hidden="true"></span>
    <span class="logo display">Savio</span>
    <span class="sub">{{Subtitle}}</span>
  </header>

  <div id="offline" class="banner bad out hidden">{{Offline}}</div>

  <div id="stale" class="hidden">
    <section class="card">
      <h2 class="title display">{{StaleTitle}}</h2>
      <p class="note">{{StaleNote}}</p>
    </section>
  </div>

  <div id="app">
    <section class="card">
      <h2 class="title display"><span class="arrow" aria-hidden="true">&rarr;</span>{{ToComputer}}</h2>
      <p class="note">{{ToComputerNote}}</p>

      <div id="where" class="hidden">
        <p class="label">{{WhereTo}}</p>
        <div class="choices" role="group" aria-label="{{WhereTo}}">{{Places}}</div>
      </div>

      <label class="cta display" for="pick">{{PickFiles}}</label>
      <input id="pick" type="file" multiple>
      <p class="note quiet under-cta">{{UploadNote}}</p>
      <div id="ios" class="banner hidden">{{IosNote}}</div>
      <div id="awake" class="banner">{{AwakeNote}}</div>

      <div id="batch" class="batch row head hidden">
        <span id="batch-line" class="grow"></span>
        <button id="cancel-all" class="pill" type="button">{{CancelAll}}</button>
      </div>
      <ul id="uploads"></ul>
    </section>

    <section class="card">
      <div class="row head">
        <h2 class="title display"><span class="arrow" aria-hidden="true">&larr;</span>{{FromComputer}}</h2>
        <button id="refresh" class="pill small" type="button">{{Refresh}}</button>
      </div>
      <p class="note under-row">{{FromComputerNote}}</p>
      <p class="label">{{FolderLine}}</p>
      <p class="note quiet" id="list-note">{{LoadingList}}</p>
      <ul id="files"></ul>
    </section>
  </div>
</main>

<script>
"use strict";

var key = new URLSearchParams(location.search).get("k") || "";
// Ждут своей очереди. Идущая отправка — отдельно, в `current`.
var queue = [];
var current = null;
// Кнопки папок и выбранная из них. Пусто — выбора нет: на компьютере
// нашлась одна папка раздачи.
var places = Array.prototype.slice.call(document.querySelectorAll("#where .choice"));
var target = null;

function $(id) { return document.getElementById(id); }

function withKey(path, extra) {
  return path + "?k=" + encodeURIComponent(key) + (extra || "");
}

function bytes(n) {
  var units = "{{ByteUnits}}".split(" ");
  var i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return i === 0 ? n + " " + units[0] : n.toFixed(1) + " " + units[i];
}

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  // Только textContent: имя файла может быть разметкой.
  if (text !== undefined) node.textContent = text;
  return node;
}

function stale() {
  $("app").classList.add("hidden");
  $("stale").classList.remove("hidden");
}

function offline(on) {
  $("offline").classList.toggle("hidden", !on);
}

// Метка отправки: по ней компьютер узнаёт, что именно отменить. Случайная,
// чтобы два телефона на одной странице не отменили друг другу файлы.
// `getRandomValues` работает и на простом HTTP, в отличие от `randomUUID`.
function newTag() {
  var out = "";
  var values = new Uint8Array(12);
  if (window.crypto && crypto.getRandomValues) {
    crypto.getRandomValues(values);
  } else {
    for (var i = 0; i < values.length; i++) values[i] = Math.floor(Math.random() * 256);
  }
  for (var j = 0; j < values.length; j++) out += (values[j] + 256).toString(16).slice(1);
  return out;
}

// ---- Куда положить ---------------------------------------------------------

// Выбор помнит сам телефон: человек, однажды выбравший «Рабочий стол»,
// и в следующий раз отправит туда же. Хранилище бывает недоступно
// (частный режим), и тогда выбор просто не запоминается.
function choose(button, remember) {
  target = button;
  places.forEach(function (other) {
    other.setAttribute("aria-pressed", other === button ? "true" : "false");
  });
  if (remember && button) {
    try { localStorage.setItem("savio-to", button.getAttribute("data-to")); } catch (e) {}
  }
}

if (places.length > 1) {
  $("where").classList.remove("hidden");
  var remembered = null;
  try { remembered = localStorage.getItem("savio-to"); } catch (e) {}
  places.forEach(function (button) {
    if (button.getAttribute("data-to") === remembered) target = button;
    button.addEventListener("click", function () { choose(button, true); });
  });
  choose(target || places[0], false);
}

// ---- Отправка на компьютер ------------------------------------------------

if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  $("ios").classList.remove("hidden");
}

$("pick").addEventListener("change", function (event) {
  var files = Array.prototype.slice.call(event.target.files || []);
  // Папка запоминается за каждым файлом в момент выбора: сменили папку,
  // пока очередь идёт, — уже выбранные файлы уедут туда, куда собирались.
  var to = target ? target.getAttribute("data-to") : "";
  var where = target ? target.textContent : "";
  // Пачка встаёт над прежними целиком и в порядке выбора: идущий файл —
  // первым в ней, а не последним, как вышло бы при вставке каждого наверх.
  var anchor = $("uploads").firstChild;
  files.forEach(function (file) {
    var job = { file: file, to: to, tag: "", xhr: null, attempt: 0, cancelled: false, actions: null };
    job.item = el("li", "item");
    var head = el("div", "row");
    head.appendChild(el("div", "name grow", file.name));
    if (where) head.appendChild(el("span", "tag", "→ " + where));
    job.bar = el("div", "bar");
    job.fill = el("div");
    job.bar.appendChild(job.fill);
    job.meta = el("div", "meta", "{{Queued}}" + bytes(file.size));
    job.item.appendChild(head);
    job.item.appendChild(job.bar);
    job.item.appendChild(job.meta);
    $("uploads").insertBefore(job.item, anchor);
    queue.push(job);
  });
  // Тот же файл можно выбрать ещё раз.
  event.target.value = "";
  next();
});

// По одному: параллельная отправка десятка роликов по Wi-Fi не быстрее,
// а оборвавшейся передачей рискует всеми сразу.
function next() {
  if (!current) {
    var job = queue.shift();
    if (job) send(job);
  }
  batch();
}

// Сводка над списком: сколько осталось и кнопка, которая снимает всё.
function batch() {
  var left = queue.length + (current && !current.cancelled ? 1 : 0);
  $("batch").classList.toggle("hidden", left === 0);
  $("batch-line").textContent = "{{FilesLeft}}".replace("{}", left);
}

function state(job, tone, text) {
  job.meta.className = tone ? "meta " + tone : "meta";
  job.meta.textContent = text;
}

function send(job) {
  var xhr = new XMLHttpRequest();
  var started = Date.now();
  // Попытка, к которой привязаны обработчики ниже. Отменённый и тут же
  // отправленный заново файл — это две попытки, и запоздалый обрыв первой
  // не должен написать «Передача оборвалась» поверх второй.
  var attempt = ++job.attempt;
  function superseded() { return job.cancelled || job.attempt !== attempt; }
  current = job;
  job.xhr = xhr;
  job.tag = newTag();
  job.bar.classList.remove("hidden");
  xhr.open("PUT", withKey("/upload/" + encodeURIComponent(job.file.name),
    "&to=" + encodeURIComponent(job.to) + "&t=" + job.tag));
  state(job, "", "{{Sending}}");

  xhr.upload.onprogress = function (event) {
    if (superseded() || !event.lengthComputable) return;
    var share = event.total ? event.loaded / event.total : 0;
    job.fill.style.width = (share * 100).toFixed(1) + "%";
    var seconds = (Date.now() - started) / 1000;
    var speed = seconds > 0.5 ? " · " + bytes(Math.round(event.loaded / seconds)) + "{{PerSecond}}" : "";
    state(job, "", "{{AmountOfTotal}}"
      .replace("{}", bytes(event.loaded))
      .replace("{}", bytes(event.total)) + speed);
  };

  // Отменённой отправке здесь сказать нечего: «Отменено» уже на экране,
  // а ответ или обрыв, пришедшие следом, — только эхо отмены.
  xhr.onload = function () {
    if (superseded()) return;
    if (xhr.status === 200) {
      var saved = job.file.name;
      try { saved = JSON.parse(xhr.responseText).name || saved; } catch (e) {}
      job.fill.style.width = "100%";
      state(job, "ok", saved === job.file.name
        ? "{{DoneWithSize}}".replace("{}", bytes(job.file.size))
        : "{{SavedAs}}".replace("{}", saved));
      offline(false);
      loadFiles();
    } else if (xhr.status === 403) {
      stale();
    } else if (xhr.status === 404 && xhr.responseText) {
      // Папки, выбранной на телефоне, на компьютере больше нет — это
      // компьютер и объясняет своими словами.
      failed(job, "bad", xhr.responseText);
    } else {
      failed(job, "bad", "{{NotAccepted}}");
    }
  };

  xhr.onerror = function () {
    if (superseded()) return;
    failed(job, "bad", "{{TransferBroke}}");
    offline(true);
  };

  // Следующий файл — только когда этот кончился совсем, как бы ни кончился.
  xhr.onloadend = function () {
    if (current === job) current = null;
    next();
  };

  xhr.send(job.file);
}

// Неудача или отмена: подпись и кнопка «Отправить ещё раз» — промахнуться
// по «Отменить все» на телефоне проще простого, и вернуть файл в очередь
// должно стоить одного нажатия.
function failed(job, tone, text) {
  state(job, tone, text);
  if (job.actions) return;
  var again = el("button", "pill small", "{{SendAgain}}");
  again.type = "button";
  job.actions = el("div", "actions");
  job.actions.appendChild(again);
  job.item.appendChild(job.actions);
  again.addEventListener("click", function () {
    job.item.removeChild(job.actions);
    job.actions = null;
    // Новая попытка: обработчики прежней, если она ещё не догорела,
    // замолкают.
    job.attempt++;
    job.cancelled = false;
    job.fill.style.width = "0";
    job.bar.classList.remove("hidden");
    state(job, "", "{{Queued}}" + bytes(job.file.size));
    queue.push(job);
    next();
  });
}

function cancelled(job) {
  job.cancelled = true;
  job.fill.style.width = "0";
  job.bar.classList.add("hidden");
  failed(job, "", "{{Cancelled}}");
}

$("cancel-all").addEventListener("click", function () {
  var waiting = queue;
  queue = [];
  waiting.forEach(cancelled);
  var job = current;
  if (job && !job.cancelled) {
    cancelled(job);
    stopOnComputer(job);
  }
  batch();
});

// Идущую отправку сперва отменяем на компьютере и только потом обрываем
// здесь. Наоборот нельзя: обрыв компьютер видит раньше отмены и
// записывает его бедой — «телефон перестал отправлять», — хотя это было
// решение человека. Ответа ждём не дольше двух секунд: компьютер мог
// и пропасть, и тогда обрыв — всё, что остаётся.
function stopOnComputer(job) {
  // Своя ручка, а не `job.xhr`: через две секунды там может стоять уже
  // новая попытка, отправленная заново, — её обрывать нельзя.
  var xhr = job.xhr;
  var done = false;
  function abort() {
    if (done) return;
    done = true;
    xhr.abort();
  }
  var request = new XMLHttpRequest();
  request.open("POST", withKey("/api/cancel", "&t=" + job.tag));
  request.onloadend = abort;
  request.send();
  setTimeout(abort, 2000);
}

window.addEventListener("beforeunload", function (event) {
  if ((current && !current.cancelled) || queue.length) {
    event.preventDefault();
    event.returnValue = "";
  }
});

// ---- Забрать с компьютера -------------------------------------------------

function loadFiles() {
  var request = new XMLHttpRequest();
  request.open("GET", withKey("/api/files"));
  request.onload = function () {
    if (request.status === 403) { stale(); return; }
    if (request.status !== 200) {
      $("list-note").textContent = "{{ListFailedRetry}}";
      return;
    }
    offline(false);
    var files = [];
    try { files = JSON.parse(request.responseText); } catch (e) {}
    showFiles(files);
  };
  request.onerror = function () {
    $("list-note").textContent = "{{ListFailed}}";
    offline(true);
  };
  request.send();
}

function showFiles(files) {
  var list = $("files");
  while (list.firstChild) list.removeChild(list.firstChild);
  $("list-note").textContent = files.length
    ? "{{FolderContents}}"
    : "{{FolderEmpty}}";

  files.forEach(function (file) {
    var item = el("li", "item");
    item.appendChild(el("div", "name", file.name));
    var when = file.modified
      ? " · " + new Date(file.modified * 1000).toLocaleString("{{LocaleTag}}", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
      : "";
    item.appendChild(el("div", "meta", bytes(file.size) + when));

    var path = "/files/" + encodeURIComponent(file.name);
    var actions = el("div", "actions");
    var open = el("a", "pill small", "{{Open}}");
    open.href = withKey(path);
    open.target = "_blank";
    open.rel = "noopener";
    var take = el("a", "pill small", "{{Download}}");
    take.href = withKey(path, "&dl=1");
    take.setAttribute("download", file.name);
    actions.appendChild(open);
    actions.appendChild(take);
    item.appendChild(actions);
    list.appendChild(item);
  });
}

$("refresh").addEventListener("click", loadFiles);
loadFiles();
</script>
</body>
</html>
