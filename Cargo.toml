[package]
name = "savio"
version = "0.22.0"
edition = "2024"

[dependencies]
eframe = "0.36"
rfd = "0.17"
serde_json = "1"
# HTTPS средствами стандартной библиотеки не решается, а докачивать yt-dlp и
# ffmpeg при первом запуске надо по HTTPS — отсюда единственная новая зависимость.
# `default-features = false` здесь обязателен: фича `gzip` включена по умолчанию
# и заставляет `Body::content_length()` возвращать `None` на сжатом ответе.
# Прогресс-бар молча выродился бы в неопределённый индикатор, а прочитать размер
# из заголовка вручную нельзя — там размер сжатых данных, бар перескочил бы 100%.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Обложку ролика надо превратить в пиксели: egui принимает только готовый RGBA,
# а разбирать JPEG стандартная библиотека не умеет. Дерево зависимостей от этой
# строки не растёт — `image` уже собирается как часть `eframe` (обмен
# картинками через буфер обмена) с фичами `png` и `bmp`, и в savio он линкуется
# и без нас. Здесь к ним добавляются только декодеры JPEG и WebP: обложки
# бывают ровно этих форматов.
#
# `default-features = false` намеренно: по умолчанию `image` тянет ещё десяток
# форматов и все кодировщики, а Savio картинки только читает. Фичу `jpeg`
# убирать нельзя — без неё перестанут показываться обложки со всех сайтов
# сразу, причём молча: ошибки сборки не будет, декодер просто не найдётся
# во время работы. Стережёт это `thumbnail::tests::required_decoders_are_compiled_in`.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
# Вкладка «Система» спрашивает железо, а стандартная библиотека о нём не знает
# ничего: ни числа ядер сверх `available_parallelism`, ни объёма памяти, ни
# списка томов. Писать это самому — три реализации на пункт (WMI, /proc и /sys,
# IOKit), и ровно ради того, чтобы их не писать, крейт и берётся.
#
# `default-features = false` здесь не экономия, а необходимость. Выключены три
# фичи, и каждая по своей причине:
#   * `component` — это температуры, и на Windows их нет. Проверено вживую:
#     `Win32_TemperatureProbe` отдаёт 16 объектов со `Status = OK` и `null`
#     в каждом показании, а `MSAcpi_ThermalZoneTemperature` отвечает «Not
#     supported». Крейт в этом случае возвращает пустой `Vec`, неотличимый от
#     «нет прав». Хуже другое: `windows/component.rs` зовёт
#     `CoInitializeSecurity`, а он процессно-глобальный и однократный — Savio
#     уже работает с COM через `rfd` (диалоги файлов), и навязанные уровни
#     олицетворения применились бы ко всему процессу.
#   * `user` — списки пользователей и групп вкладке не нужны.
#   * `multithread` — это `rayon` ради параллельного обхода. Опрос и так идёт
#     в своём потоке и занимает доли секунды, так что платить за пул потоков
#     здесь нечем.
sysinfo = { version = "0.39", default-features = false, features = [
    "system",
    "disk",
    "network",
] }
# Износ батареи — то, ради чего вкладку и открывают на ноутбуке, — стандартная
# библиотека не отдаёт, а руками это три разных механизма: SetupAPI с
# `IOCTL_BATTERY_QUERY_INFORMATION` на Windows, `/sys/class/power_supply` на
# Linux, IOKit на macOS. Крейт закрывает все три и заметно честнее соседей:
# итератор отдаёт `Result` на каждое устройство, поэтому сбой чтения одной
# батареи всплывает, а не тонет в общем «ничего не нашли».
#
# Взят именно форк Starship, а не исходный `battery`: тот не выпускался
# с ноября 2020 года и на macOS тянул бы вторую копию `core-foundation`
# рядом с той, что уже есть в дереве.
starship-battery = "0.11"
# Перечисление USB — снова три механизма (SetupAPI, /sys/bus/usb, IOKit),
# и снова крейт нужен ровно чтобы не писать их втроём. Родные API на каждой
# системе, без `libusb` и без компилятора C: портативная поставка Savio
# зависимости от чужой DLL не пережила бы.
#
# Важно, что берётся `nusb`, а не более известный `rusb`. Тот работает через
# `libusb`, а `libusb` на Windows видит только устройства с драйвером
# WinUSB/libusbK — на обычной машине список пришёл бы пустым, причём с кодом
# успеха. Это ровно тот молчаливый отказ, о котором Правило 6, и здесь он был
# бы не редким случаем, а основным.
nusb = "0.2"
