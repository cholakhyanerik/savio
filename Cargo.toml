[package]
name = "savio"
version = "0.13.0"
edition = "2024"

[dependencies]
eframe = "0.35"
rfd = "0.17"
serde_json = "1"
# HTTPS средствами стандартной библиотеки не решается, а докачивать yt-dlp и
# ffmpeg при первом запуске надо по HTTPS — отсюда единственная новая зависимость.
# `default-features = false` здесь обязателен: фича `gzip` включена по умолчанию
# и заставляет `Body::content_length()` возвращать `None` на сжатом ответе.
# Прогресс-бар молча выродился бы в неопределённый индикатор, а прочитать размер
# из заголовка вручную нельзя — там размер сжатых данных, бар перескочил бы 100%.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Обложку ролика надо превратить в пиксели: egui принимает только готовый RGBA,
# а разбирать JPEG стандартная библиотека не умеет. Дерево зависимостей от этой
# строки не растёт — `image` уже собирается как часть `eframe` (обмен
# картинками через буфер обмена) с фичами `png` и `bmp`, и в savio он линкуется
# и без нас. Здесь к ним добавляются только декодеры JPEG и WebP: обложки
# бывают ровно этих форматов.
#
# `default-features = false` намеренно: по умолчанию `image` тянет ещё десяток
# форматов и все кодировщики, а Savio картинки только читает. Фичу `jpeg`
# убирать нельзя — без неё перестанут показываться обложки со всех сайтов
# сразу, причём молча: ошибки сборки не будет, декодер просто не найдётся
# во время работы. Стережёт это `thumbnail::tests::required_decoders_are_compiled_in`.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
